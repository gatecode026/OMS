name: Enterprise DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: 🛡️ Code Quality & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      - name: TypeScript Type Checking
        run: |
          cd mobile
          npx tsc --noEmit

  automated-testing:
    name: 🧪 Automated Test Suite Execution
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Run Mobile Jest Unit & Integration Tests
        run: |
          cd mobile
          npm ci
          npx jest --passWithNoTests --coverage --coverageThreshold='{"global":{"statements":95,"branches":95,"functions":95,"lines":95}}'

  security-and-vulnerabilities:
    name: 🔐 DevSecOps SAST & Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Run Secret & Dependency Security Audit
        run: |
          cd mobile
          npm audit --audit-level=high || true

  docker-build-verification:
    name: 🐳 Docker Container Build & Health Verification
    runs-on: ubuntu-latest
    needs: [automated-testing, security-and-vulnerabilities]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Build Production Backend Docker Image
        run: |
          cd backend
          docker build -t oms-backend-api:latest .
