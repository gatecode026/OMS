# /etc/coturn/coturn.conf - Production Coturn STUN/TURN Configuration Template
# For OMS Enterprise Calling System

# ── NETWORK PORTS ──────────────────────────────────────────────────────────
# Standard STUN/TURN port (required for UDP and TCP traffic)
listening-port=3478

# Secure TLS TURN port (runs TURN over TLS, bypasses most strict firewalls)
tls-listening-port=5349

# Listen on all IPv4 interfaces
listening-ip=0.0.0.0

# Public IP address of the server (MUST be set in production)
# Replace with your Cloud VPS public IPv4 (e.g. external-ip=172.56.98.112)
# external-ip=YOUR_PUBLIC_IP

# ── SECURITY & REALM ────────────────────────────────────────────────────────
# The realm serves as the naming domain for credentials
realm=gatexpay.co.in

# Use long-term credential mechanism (standard for WebRTC calling)
lt-cred-mech

# Use shared secret for secure dynamic authentication (WebRTC token generation)
use-auth-secret
static-auth-secret=YOUR_PRODUCTION_SHARED_SECRET_2026

# ── TLS / SSL CERTIFICATES ──────────────────────────────────────────────────
# TLS Certificate and Private Key (typically obtained via Let's Encrypt Certbot)
# cert=/etc/letsencrypt/live/gatexpay.co.in/fullchain.pem
# pkey=/etc/letsencrypt/live/gatexpay.co.in/privkey.pem

# Secure cipher suite configuration (modern, strong TLS configs)
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

# ── PERFORMANCE & ROUTING ───────────────────────────────────────────────────
# Ports to allocate for media forwarding (UDP traffic range)
min-port=49152
max-port=65535

# Do not allow loopback or local network IP addresses as media peers (prevents internal attacks)
no-multicast-peers
no-local-ip

# Total quota of allocations per user
user-quota=100
total-quota=10000

# ── LOGGING ─────────────────────────────────────────────────────────────────
# Log output configuration
no-stdout-log
syslog
verbose
