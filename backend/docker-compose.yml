version: '3.8'

services:
  oms-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oms-backend-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/oms_production
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongo
      - redis
    networks:
      - oms-network

  redis:
    image: redis:7-alpine
    container_name: oms-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - oms-network

  mongo:
    image: mongo:7.0
    container_name: oms-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - oms-network

  coturn:
    image: coturn/coturn:latest
    container_name: oms-coturn
    restart: always
    network_mode: host
    volumes:
      - ./coturn.conf:/etc/coturn/turnserver.conf:ro

networks:
  oms-network:
    driver: bridge

volumes:
  redis-data:
  mongo-data:
